<!-- ══════════ Clique em WhatsApp -> dataLayer ══════════
     Dispara o evento "whatsapp_click" em qualquer link wa.me da página.
     No GTM: Acionador > Evento personalizado > nome do evento: whatsapp_click
     Variáveis disponíveis: wa_origem, wa_texto, wa_url                      -->
<script>
(function(){
  window.dataLayer = window.dataLayer || [];
  document.addEventListener('click', function(e){
    var alvo = e.target;
    if (!alvo || !alvo.closest) return;
    var a = alvo.closest('a[href*="wa.me"]');
    if (!a) return;

    var origem = 'outro';
    if (a.id === 'float')                 { origem = 'botao-flutuante'; }
    else if (a.closest('header, nav'))    { origem = 'menu'; }
    else if (a.closest('footer'))         { origem = 'rodape'; }
    else {
      var sec = a.closest('section[id]');
      if (sec) { origem = sec.id; }
    }

    window.dataLayer.push({
      event:     'whatsapp_click',
      wa_origem: origem,
      wa_texto:  (a.getAttribute('aria-label') || a.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 80),
      wa_url:    a.href
    });
  }, true);
})();
</script>
